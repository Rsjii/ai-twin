version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-twin-db
    environment:
      POSTGRES_DB: ai_twin_db
      POSTGRES_USER: ai_twin_user
      POSTGRES_PASSWORD: ai_twin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-twin-network

  # AI Twin Backend
  backend:
    build:
      context: .
      dockerfile: config/Dockerfile
    container_name: ai-twin-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ai_twin_user:ai_twin_password@postgres:5432/ai_twin_db
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - ai-twin-network
    volumes:
      - ./logs:/app/logs

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-twin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/src/public:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - ai-twin-network

volumes:
  postgres_data:

networks:
  ai-twin-network:
    driver: bridge
